[package]
name = "johnny-bravo-tauri"
version = "0.1.0"
description = "Johnny Bravo Media Tools — YouTube Downloader & File Converter"
authors = ["you"]
edition = "2021"

[lib]
name = "johnny_bravo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
